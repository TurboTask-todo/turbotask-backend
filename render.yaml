# Render Blueprint for QuantumTask API deployment
services:
  - type: web
    name: quantumtask-api
    env: go
    plan: starter # Change to standard/pro for production
    buildCommand: go build -o main ./cmd/server
    startCommand: ./main
    envVars:
      - key: APP_NAME
        value: QuantumTask API
      - key: APP_VERSION
        value: "1.0.0"
      - key: APP_ENV
        value: production
      - key: GIN_MODE
        value: release
      - key: PORT
        fromService:
          type: web
          name: quantumtask-api
          property: port
      - key: DATABASE_URL
        fromDatabase:
          type: postgresql
          name: quantumtask-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: quantumtask-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_TOKEN_DURATION
        value: "15m"
      - key: JWT_REFRESH_TOKEN_DURATION
        value: "7d"
    healthCheckPath: /health
    
databases:
  - name: quantumtask-postgres
    databaseName: quantumtask
    user: quantumtask
    plan: starter # Change to standard/pro for production

  - name: quantumtask-redis
    plan: starter # Change to standard/pro for production
